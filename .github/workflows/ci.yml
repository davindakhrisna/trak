name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Format Check
        run: cargo fmt --check

      - name: Clippy (SSR)
        run: cargo clippy -- -D warnings

  test-and-build:
    name: Test & WASM Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check WASM Client
        run: cargo check --target wasm32-unknown-unknown --no-default-features --features hydrate

      - name: Run Security, Ntfy & Lockdown Integration Tests
        run: cargo test --features ssr

  release:
    name: Release Assets & OCI Image
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, test-and-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install cargo-leptos via cargo-binstall
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall --no-confirm cargo-leptos

      - name: Install Tailwind CSS v3 CLI
        run: |
          curl -sLO https://github.com/tailwindlabs/tailwindcss/releases/download/v3.4.17/tailwindcss-linux-x64
          chmod +x tailwindcss-linux-x64
          sudo mv tailwindcss-linux-x64 /usr/local/bin/tailwindcss
          tailwindcss --help | head -n 2

      - name: Build Production Release
        env:
          LEPTOS_TAILWIND_VERSION: v3.4.17
        run: cargo leptos build --release

      - name: Package Release Archive
        run: |
          mkdir -p release-bundle/site
          cp target/release/trak release-bundle/
          cp -r target/site/* release-bundle/site/
          cp deploy/* release-bundle/ 2>/dev/null || true
          cp .env.example release-bundle/
          tar -czf trak-linux-x86_64.tar.gz -C release-bundle .

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: trak-linux-x86_64.tar.gz
          draft: false
          prerelease: false
          generate_release_notes: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and push Docker image to GHCR
        id: docker_build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Promote image digest to nixos-vps
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          PLATFORM_TOKEN: ${{ secrets.PLATFORM_TOKEN }}
          DIGEST: ${{ steps.docker_build.outputs.digest }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if [ -z "$PLATFORM_TOKEN" ]; then
            echo "PLATFORM_TOKEN secret is not set, skipping nixos-vps promotion."
            exit 0
          fi

          git config --global user.name "davindakhrisna"
          git config --global user.email "arpeggio.gns@gmail.com"

          git clone "https://x-access-token:${PLATFORM_TOKEN}@github.com/gala-edukasi-nusantara/nixos-vps.git" /tmp/nixos-vps
          cd /tmp/nixos-vps

          IMAGE_REF="ghcr.io/${{ github.repository }}@${DIGEST}"
          echo "Promoting image: ${IMAGE_REF}"

          sed -i -E "s|image = \"ghcr\.io/davindakhrisna/trak@[^\"]+\";|image = \"${IMAGE_REF}\";|" host/default.nix

          if git diff --quiet host/default.nix; then
            echo "No change in image digest."
            exit 0
          fi

          BRANCH="auto/trak-${TAG_NAME}"
          git checkout -b "$BRANCH"
          git add host/default.nix
          git commit -m "feat(trak): update image digest to ${TAG_NAME}"
          git push -u origin "$BRANCH"

          GH_TOKEN="${PLATFORM_TOKEN}" gh pr create \
            --repo gala-edukasi-nusantara/nixos-vps \
            --base main \
            --head "$BRANCH" \
            --title "feat(trak): update image digest to ${TAG_NAME}" \
            --body "Automated promotion of release **${TAG_NAME}** from [davindakhrisna/trak](https://github.com/davindakhrisna/trak).

**Image Digest:** \`${IMAGE_REF}\`"
